[/Script/Engine.GameUserSettings]
; Starts in a 1280x720 window (fits every screen incl. the 14" MacBook Pro; the menu shrinks any window taller
; than the desktop). Alt+Enter / F11 = borderless full screen at the desktop resolution (16:9, 21:9, 32:9).
bUseDesiredScreenHeight=False
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=1
FrameRateLimit=60.000000
bUseVSync=True

; Start on HIGH instead of EPIC (less memory and heat on laptops); players can change it in PROTOCOLS > GRAPHICS.
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2
