; Lumen (real-time GI + reflections) only on HIGH and above; MEDIUM/LOW use cheaper screen-space lighting and
; smaller Lumen/Nanite pools (about 2 GB less memory). Overrides on top of the engine's BaseScalability.ini.
[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.SurfaceCache.AtlasSize=1024

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=2
r.Lumen.DiffuseIndirect.Allow=0
r.LumenScene.SurfaceCache.AtlasSize=1024

[ReflectionQuality@0]
r.ReflectionMethod=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.ReflectionMethod=2
r.Lumen.Reflections.Allow=0
