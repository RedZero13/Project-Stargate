; iPad (M-series): no Lumen / hardware RT, medium shadows, 80% render scale, textures capped at 2048
[IOS DeviceProfile]
DeviceType=IOS
BaseProfileName=
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=2
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.ViewDistanceQuality=2
+CVars=r.ScreenPercentage=80
+CVars=r.Streaming.PoolSize=1500
