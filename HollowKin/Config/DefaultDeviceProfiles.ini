; HOLLOW KIN: cap texture size at 2048 on Mac so the packaged game is smaller.
; Cooking drops mip levels above MaxLODSize. UI, lightmaps and data textures keep their full size.
[Mac DeviceProfile]
; Memory: on Macs RAM and video memory are shared, so cap the texture streaming pool (MB) and the virtual shadow map page pool.
+CVars=r.Streaming.PoolSize=1000
+CVars=r.Shadow.Virtual.MaxPhysicalPages=2048
!TextureLODGroups=ClearArray
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
